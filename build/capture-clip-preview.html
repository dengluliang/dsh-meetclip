<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>内联采集面板裁切预览</title>
<style>
  html, body { margin: 0; min-height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  :root {
    --dsw-alias-bg-base: #f7f6f3;
    --dsw-alias-bg-layer-1: #fff;
    --dsw-alias-bg-layer-2: #fff;
    --dsw-alias-bg-overlay: #fff;
    --dsw-alias-label-primary: #1d1d1f;
    --dsw-alias-label-secondary: #6b6b70;
    --dsw-alias-label-tertiary: #929298;
    --dsw-alias-label-caption: #b0b0b5;
    --dsw-alias-label-primary-inverted: #fff;
    --dsw-alias-border-l1: rgba(0, 0, 0, .07);
    --dsw-alias-border-l2: rgba(0, 0, 0, .1);
    --dsw-alias-border-l4: rgba(0, 0, 0, .16);
    --dsw-alias-brand-primary: #1d1d1f;
    --dsw-alias-button-primary-fill: #1d1d1f;
    --dsw-alias-button-primary-hover: #333;
    --dsw-alias-interactive-bg-hover: rgba(0, 0, 0, .045);
    --dsw-alias-interactive-bg-active: rgba(0, 0, 0, .075);
    --dsw-alias-state-success-primary: #2f9d62;
    --dsw-alias-state-warn-primary: #c58a20;
    --dsw-alias-state-error-primary: #d24b45;
    --dsw-alias-state-idle-primary: #b5b5ba;
    --dsw-elevation-soft: 0 10px 30px -18px rgba(0, 0, 0, .28);
    --dsh-frame-top-clearance: 0px;
  }
  :root[data-theme='dark'] {
    --dsw-alias-bg-base: #151517;
    --dsw-alias-bg-layer-1: #1f1f22;
    --dsw-alias-bg-layer-2: #2b2b2d;
    --dsw-alias-bg-overlay: #2b2b2d;
    --dsw-alias-label-primary: #f6f6f7;
    --dsw-alias-label-secondary: #b6b6bb;
    --dsw-alias-label-tertiary: #8f8f94;
    --dsw-alias-label-caption: #6f6f74;
    --dsw-alias-label-primary-inverted: #151517;
    --dsw-alias-border-l1: rgba(255, 255, 255, .08);
    --dsw-alias-border-l2: rgba(255, 255, 255, .12);
    --dsw-alias-border-l4: rgba(255, 255, 255, .2);
    --dsw-alias-brand-primary: #f6f6f7;
    --dsw-alias-button-primary-fill: #f6f6f7;
    --dsw-alias-button-primary-hover: #e2e2e4;
    --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, .06);
    --dsw-alias-interactive-bg-active: rgba(255, 255, 255, .1);
    --dsw-alias-state-success-primary: #4cc38a;
    --dsw-alias-state-warn-primary: #e0a43a;
    --dsw-alias-state-error-primary: #ff6b64;
    --dsw-alias-state-idle-primary: #6d6d72;
    --dsw-elevation-soft: 0 12px 34px -18px rgba(0, 0, 0, .8);
  }
  body { background: var(--dsw-alias-bg-base); color: var(--dsw-alias-label-primary); }
  .preview-page { height: auto; min-height: 100vh; align-items: center; justify-content: center; gap: 18px; padding: 48px 56px 56px; background:
    radial-gradient(60vmax 40vmax at 12% 0%, color-mix(in srgb, #c9d9ff 26%, transparent), transparent 70%),
    radial-gradient(56vmax 38vmax at 88% 4%, color-mix(in srgb, #f3d9e8 26%, transparent), transparent 70%),
    var(--dsw-alias-bg-base);
  }
  .preview-caption { margin: 0 0 18px; color: var(--dsw-alias-label-secondary); font-size: 13px; letter-spacing: .01em; }
  .preview-caption::before { content: '新'; display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; margin-right: 8px; border-radius: 6px; background: var(--dsw-alias-state-error-primary); color: #fff; font-size: 10px; font-weight: 700; vertical-align: 1px; }
  .preview-note { margin: 20px 0 0; max-width: 360px; color: var(--dsw-alias-label-tertiary); font-size: 11.5px; line-height: 1.65; }
  .preview-card-stage, .preview-overlay-stage { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .preview-both { display: flex; align-items: flex-start; justify-content: center; gap: 40px; width: 100%; max-width: 1120px; }
  .preview-col { display: flex; flex-direction: column; align-items: flex-start; }
  .preview-col-card { width: 316px; }
  .preview-col-overlay { width: 680px; }
  .preview-col .preview-note { max-width: 300px; margin-top: 16px; }
  .preview-col-overlay .preview-note { max-width: 520px; }
  .preview-card-wrap { width: 300px; }
  .preview-card-wrap .mc-batch-card { min-height: 224px; }
  .preview-overlay-wrap { width: 100%; display: flex; justify-content: center; }
  .preview-overlay-wrap .mc-modal-layer { position: static; inset: auto; display: block; padding: 0; background: transparent; backdrop-filter: none; }
  .preview-overlay-wrap .mc-batch-modal { width: 680px; max-height: none; }
  .preview-overlay-wrap .mc-batch-list { max-height: none; }
  .preview-overlay-wrap .mc-batch-member { cursor: default; }
  :root[data-theme='dark'] .preview-page { background:
    radial-gradient(60vmax 40vmax at 12% 0%, color-mix(in srgb, #27407a 22%, transparent), transparent 70%),
    radial-gradient(56vmax 38vmax at 88% 4%, color-mix(in srgb, #5b2b45 18%, transparent), transparent 70%),
    var(--dsw-alias-bg-base);
  }
  html, body, #root { height: 100%; }
  #root > .mc-root { height: 100%; }
</style>
<script>
  if (window.location.search.includes('theme=dark')) document.documentElement.dataset.theme = 'dark'
</script>
</head>
<body>
<div id="root"></div>
<script src="./capture-clip-preview.js"></script>
</body>
</html>
