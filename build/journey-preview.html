<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MeetClip journey preview</title>
  <style>html,body,#root{margin:0;min-height:100%;background:#f7f6f3}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}</style>
</head>
<body><div id="root"></div><script>window.onerror=function(m,s,l,c,e){document.body.innerHTML='<pre id="ERR">'+String(m)+'\n'+String(e&&e.stack||'')+'</pre>'};window.addEventListener('unhandledrejection',function(e){document.body.innerHTML='<pre id="ERR">'+String(e.reason&&e.reason.stack||e.reason)+'</pre>'})</script><script src="./journey-preview.js"></script></body>
</html>
