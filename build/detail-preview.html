<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>会摘 · 未完成转写预览</title>
<style>

  html, body { margin: 0; height: 100%; background: #f7f6f3; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
  :root {
    --dsw-alias-bg-base: #f7f6f3;
    --dsw-alias-bg-layer-1: #fff;
    --dsw-alias-bg-layer-2: #fff;
    --dsw-alias-label-primary: #1d1d1f;
    --dsw-alias-label-secondary: #6b6b70;
    --dsw-alias-label-tertiary: #929298;
    --dsw-alias-label-caption: #b0b0b5;
    --dsw-alias-label-primary-inverted: #fff;
    --dsw-alias-border-l1: rgba(0, 0, 0, .07);
    --dsw-alias-border-l2: rgba(0, 0, 0, .1);
    --dsw-alias-border-l4: rgba(0, 0, 0, .16);
    --dsw-alias-brand-primary: #1d1d1f;
    --dsw-alias-button-primary-fill: #1d1d1f;
    --dsw-alias-button-primary-hover: #333;
    --dsw-alias-interactive-bg-hover: rgba(0, 0, 0, .045);
    --dsw-alias-interactive-bg-active: rgba(0, 0, 0, .075);
    --dsw-alias-state-success-primary: #2f9d62;
    --dsw-alias-state-warn-primary: #c58a20;
    --dsw-alias-state-error-primary: #d24b45;
    --dsw-alias-state-idle-primary: #b5b5ba;
    --dsw-elevation-soft: 0 10px 30px -18px rgba(0, 0, 0, .28);
    --dsh-frame-top-clearance: 0px;
  }
  :root[data-theme='dark'] {
    --dsw-alias-bg-base: #151517;
    --dsw-alias-bg-layer-1: #1f1f22;
    --dsw-alias-bg-layer-2: #2b2b2d;
    --dsw-alias-label-primary: #f6f6f7;
    --dsw-alias-label-secondary: #b6b6bb;
    --dsw-alias-label-tertiary: #8f8f94;
    --dsw-alias-label-caption: #6f6f74;
    --dsw-alias-label-primary-inverted: #151517;
    --dsw-alias-border-l1: rgba(255, 255, 255, .08);
    --dsw-alias-border-l2: rgba(255, 255, 255, .12);
    --dsw-alias-border-l4: rgba(255, 255, 255, .2);
    --dsw-alias-brand-primary: #f6f6f7;
    --dsw-alias-button-primary-fill: #f6f6f7;
    --dsw-alias-button-primary-hover: #e2e2e4;
    --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, .06);
    --dsw-alias-interactive-bg-active: rgba(255, 255, 255, .1);
    --dsw-alias-state-success-primary: #4cc38a;
    --dsw-alias-state-warn-primary: #e0a43a;
    --dsw-alias-state-error-primary: #ff6b64;
    --dsw-alias-state-idle-primary: #6d6d72;
    --dsw-elevation-soft: 0 12px 34px -18px rgba(0, 0, 0, .8);
  }
  :root[data-theme='dark'] body { background: #151517; color: #f6f6f7; }
  #root { height: 100vh; }

  html, body { margin: 0; height: 100%; background: #f7f6f3; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>
<pre id="err" style="position:fixed;left:8px;top:8px;z-index:9999;color:#b00;font:12px monospace;white-space:pre-wrap"></pre>
<script>
function showErr(e){ var pre=document.getElementById('err'); if(pre) pre.textContent = (e && (e.stack || e.message)) || String(e); }
window.addEventListener('error', function(e){ showErr(e.error || e.message) });
window.addEventListener('unhandledrejection', function(e){ showErr(e.reason) });
</script>
<script src="./detail-preview.js"></script>
</body>
</html>
