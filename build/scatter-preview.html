<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>会摘 · 散落画布预览</title>
<style>
  html, body { margin: 0; height: 100%; background: #f7f6f3; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
  :root {
    --dsw-alias-bg-base: #f7f6f3;
    --dsw-alias-bg-layer-1: #fff;
    --dsw-alias-bg-layer-2: #fff;
    --dsw-alias-label-primary: #1d1d1f;
    --dsw-alias-label-secondary: #6b6b70;
    --dsw-alias-label-tertiary: #929298;
    --dsw-alias-label-caption: #b0b0b5;
    --dsw-alias-label-primary-inverted: #fff;
    --dsw-alias-border-l1: rgba(0, 0, 0, .07);
    --dsw-alias-border-l2: rgba(0, 0, 0, .1);
    --dsw-alias-border-l4: rgba(0, 0, 0, .16);
    --dsw-alias-brand-primary: #1d1d1f;
    --dsw-alias-button-primary-fill: #1d1d1f;
    --dsw-alias-button-primary-hover: #333;
    --dsw-alias-interactive-bg-hover: rgba(0, 0, 0, .045);
    --dsw-alias-interactive-bg-active: rgba(0, 0, 0, .075);
    --dsw-alias-state-success-primary: #2f9d62;
    --dsw-alias-state-warn-primary: #c58a20;
    --dsw-alias-state-error-primary: #d24b45;
    --dsw-alias-state-idle-primary: #b5b5ba;
    --dsw-elevation-soft: 0 10px 30px -18px rgba(0, 0, 0, .28);
    --dsh-frame-top-clearance: 0px;
  }
  :root[data-theme='dark'] {
    --dsw-alias-bg-base: #151517;
    --dsw-alias-bg-layer-1: #1f1f22;
    --dsw-alias-bg-layer-2: #2b2b2d;
    --dsw-alias-label-primary: #f6f6f7;
    --dsw-alias-label-secondary: #b6b6bb;
    --dsw-alias-label-tertiary: #8f8f94;
    --dsw-alias-label-caption: #6f6f74;
    --dsw-alias-label-primary-inverted: #151517;
    --dsw-alias-border-l1: rgba(255, 255, 255, .08);
    --dsw-alias-border-l2: rgba(255, 255, 255, .12);
    --dsw-alias-border-l4: rgba(255, 255, 255, .2);
    --dsw-alias-brand-primary: #f6f6f7;
    --dsw-alias-button-primary-fill: #f6f6f7;
    --dsw-alias-button-primary-hover: #e2e2e4;
    --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, .06);
    --dsw-alias-interactive-bg-active: rgba(255, 255, 255, .1);
    --dsw-alias-state-success-primary: #4cc38a;
    --dsw-alias-state-warn-primary: #e0a43a;
    --dsw-alias-state-error-primary: #ff6b64;
    --dsw-alias-state-idle-primary: #6d6d72;
    --dsw-elevation-soft: 0 12px 34px -18px rgba(0, 0, 0, .8);
  }
  :root[data-theme='dark'] body { background: #151517; color: #f6f6f7; }
  #root { height: 100vh; }
</style>
<script>
  if (window.location.search.includes('theme=dark')) document.documentElement.dataset.theme = 'dark'
  window.__ModuleLoader__ = { load(entry) { window.__entry = entry } }
</script>
</head>
<body>
<div id="root"></div>
<script src="../client.js"></script>
<script src="./scatter-preview.js"></script>
<script>
// 预览用：file:// 下没有后端，把 board image 的接口 URL 换成本地画的示意图。
const boardPhoto = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620">'
  + '<defs><linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f1e9"/><stop offset=".55" stop-color="#e7e2d5"/><stop offset="1" stop-color="#d9d2c1"/></linearGradient></defs>'
  + '<rect width="900" height="620" fill="url(#wall)"/>'
  + '<path d="M40 96h700M40 190h640" stroke="#fff" stroke-width="5" opacity=".55"/>'
  + '<g fill="#5f6157" font-family="Songti SC, serif" font-size="27" opacity=".78">'
  + '<text x="128" y="284">17U 代旗舰</text><text x="446" y="284">折叠 08</text><text x="700" y="282">长焦</text>'
  + '<text x="132" y="352" fill="#3d6f9c" font-size="24">比自己</text><text x="470" y="352">—</text><text x="702" y="352">—</text>'
  + '<text x="132" y="414" fill="#3d6f9c" font-size="24">UX 体验</text><text x="474" y="414">✓</text><text x="704" y="414">✓</text>'
  + '<text x="316" y="414" fill="#3d6f9c" font-size="22">OVRH</text><text x="480" y="452">H 8</text>'
  + '</g>'
  + '<g transform="translate(430,548)"><circle r="15" fill="#c8102e"/><text x="0" y="5" text-anchor="middle" fill="#fff" font-family="Songti SC, serif" font-size="14">L</text>'
  + '<text x="34" y="5" fill="#8a8578" font-family="Songti SC, serif" font-size="13">Live Moment</text></g>'
  + '<text x="430" y="588" text-anchor="middle" fill="#a49f92" font-family="monospace" font-size="11">46mm · f/1.7 · 1/100s · ISO200</text>'
  + '</svg>'
)
function fixBoardImages() {
  for (const img of document.querySelectorAll('img')) {
    const src = img.getAttribute('src') || ''
    if (!src.includes('/meetclip/api/board/images/')) continue
    if (img.dataset.demoSrc === '1') continue
    img.dataset.demoSrc = '1'
    img.src = boardPhoto
  }
}
new MutationObserver(fixBoardImages).observe(document.documentElement, { childList: true, subtree: true })
setInterval(fixBoardImages, 300)
</script>
<script>
if (window.location.search.includes('card=delete')) {
  const style = document.createElement('style')
  style.textContent = ".mc-scatter-card[data-node='session-s2'] .mc-home-card-actions{opacity:1!important;transform:none!important}"
    + ".mc-scatter-card[data-node='session-s2'] .mc-home-card-actions button{background:rgb(255 255 255 / .92)!important;color:#c1443d!important;border-color:rgb(255 255 255 / .6)!important;box-shadow:0 4px 12px -4px rgb(0 0 0 / .45)}"
  document.head.append(style)
  if (window.location.search.includes('confirm=1')) {
    let tries = 0
    const timer = setInterval(() => {
      const button = document.querySelector(".mc-scatter-card[data-node='session-s2'] .mc-home-card-actions button[data-action='delete']")
      if (button) { clearInterval(timer); button.click() }
      else if (++tries > 80) clearInterval(timer)
    }, 100)
  }
}
</script>
<script>
// ?board=1&confirm=board —— 点图片卡上的「删除」，截应用内确认弹层（取消 / 确认）。
if (window.location.search.includes('confirm=board')) {
  let tries = 0
  const timer = setInterval(() => {
    const button = document.querySelector(".mc-image-card .mc-card-actions button[data-action='delete']")
    if (button) { clearInterval(timer); button.click() }
    else if (++tries > 80) clearInterval(timer)
  }, 100)
}
</script>
</body>
</html>
